{% extends 'plain_base.html' %}

{% block extrahead %}
<style>
    html, body { height: 100%; overflow: hidden; }

    .sg {
        --sg-gap: 1.1em;
        font-size: clamp(11px, 0.95vw, 28px);
        height: 100vh;
        padding: 1.4em 2.2em 1em;
        display: flex;
        flex-direction: column;
        gap: var(--sg-gap);
    }

    .sg-header { display: flex; align-items: center; justify-content: space-between; flex: 0 0 auto; }
    .sg-brand { display: flex; align-items: center; gap: 1em; }
    .sg-logo { height: 4.5em; }
    .sg-title { font-family: "Times New Roman", serif; color: var(--datblue); font-size: 2.8em; margin: 0; line-height: 1; }
    .sg-tagline { margin: .3em 0 0; font-size: 1.1em; }
    .sg-clock { text-align: right; line-height: 1.15; }
    .sg-time { font-size: 3.2em; font-weight: 600; font-variant-numeric: tabular-nums; }
    .sg-date { font-size: 1.15em; }

    .sg-main { flex: 1 1 0; min-height: 0; display: flex; gap: var(--sg-gap); }
    .sg-col { display: flex; flex-direction: column; gap: var(--sg-gap); min-height: 0; min-width: 0; flex: 1 1 0; }
    .sg-row { display: flex; gap: var(--sg-gap); min-height: 0; min-width: 0; }
    .sg-cols { display: flex; gap: var(--sg-gap); flex: 1 1 0; min-height: 0; }

    .sg-card { flex: 1 1 0; min-height: 0; min-width: 0; margin: 0; overflow: hidden; }
    .sg-card .card-header { font-size: 1.2em; font-weight: 600; padding: .6em 1em; }
    .sg-card-body { flex: 1 1 0; min-height: 0; padding: 1em; display: flex; }

    .sg-item { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; align-items: center; gap: 1.1em; }
    .sg-item-media { align-self: stretch; aspect-ratio: 1 / 1; max-width: 48%; min-height: 0; border-radius: .5em; }
    .sg-item-info { display: flex; flex-direction: column; align-items: flex-start; gap: .4em; min-width: 0; }
    .sg-item-name { font-size: 1.6em; font-weight: 600; line-height: 1.15; }
    .sg-item-abv { font-size: .6em; font-weight: 400; text-decoration: underline; color: var(--bs-secondary-color); }
    .sg-item-brewery { font-size: 1em; color: var(--bs-secondary-color); }
    .sg-item-price { font-size: 1.7em; line-height: 1; }
    .sg-tags { font-size: 1em; }

    .sg-beer .sg-item-media { background-color: #fff; }
    .sg-beer .sg-item-name { font-size: 2.1em; }
    .sg-beer .sg-item-price { font-size: 2.2em; }

    .sg-spotlight-grid {
        flex: 1 1 0; min-height: 0; min-width: 0;
        display: grid; grid-template-columns: repeat(auto-fit, minmax(16em, 1fr)); grid-auto-rows: 1fr;
        overflow: hidden;
    }
    .sg-spotlight-cell { padding: .8em; display: flex; min-height: 0; min-width: 0; overflow: hidden; }
    .sg-spotlight-cell .sg-item { align-items: center; }
    .sg-spotlight-cell .sg-item-media { align-self: center; width: 7.5em; aspect-ratio: 1 / 1; max-width: 45%; height: auto; max-height: 100%; }

    .sg-events { display: flex; flex-direction: column; gap: .7em; flex: 1 1 0; min-height: 0; min-width: 0; }
    .sg-events-title { font-size: 2em; margin: 0; flex: 0 0 auto; }
    .sg-events-list { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; gap: var(--sg-gap); }
    .sg-event { flex: 1 1 0; min-height: 0; flex-direction: row; overflow: hidden; margin: 0; max-height: 18em; }
    .sg-event-img { width: 32%; height: 100%; object-fit: cover; flex: 0 0 auto; }
    .sg-event-body { padding: 1em 1.2em; display: flex; flex-direction: column; gap: .5em; min-width: 0; justify-content: center; flex: 1 1 auto; }
    .sg-event-name { font-size: 1.7em; margin: 0; line-height: 1.1; }
    .sg-event-desc { margin: 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .sg-event-meta { display: flex; flex-direction: column; gap: .35em; font-size: 1.05em; }
    .sg-empty { font-size: 1.2em; padding: 1em; }

    .sg-qr { flex: 0 0 auto; margin: 0; flex-direction: row; align-items: center; gap: 1.2em; padding: 1em 1.2em; }
    .sg-qr-img { height: 9em; width: 9em; flex: 0 0 auto; }
    .sg-qr-text { display: flex; flex-direction: column; gap: .4em; min-width: 0; }
    .sg-qr-cta { font-size: 1.5em; font-weight: 600; line-height: 1.15; }
    .sg-qr-url { font-size: 1em; overflow-wrap: anywhere; }
    .sg-version { flex: 0 0 auto; text-align: center; opacity: .75; margin-top: -.4em; }

    .sg-layout-a .sg-col-showcase { flex: 7 1 0; }
    .sg-layout-a .sg-col-side { flex: 5 1 0; }
    .sg-layout-a .sg-beer { flex: 11 1 0; }
    .sg-layout-a .sg-spotlight { flex: 9 1 0; }
    .sg-layout-a .sg-beer .sg-card-body { padding: 1.2em; }


</style>
{% endblock %}

{% block body_content %}

<meta http-equiv="refresh" content="20" />

<div class="sg sg-layout-a">
    {% include "signage/_header.html" %}
    {% include "signage/layout_a.html" %}
    {% include "signage/_version.html" %}
</div>

{% endblock %}
